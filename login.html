<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weaver-ID | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --dti-green: #0a4d2e;
      --dti-green-hover: #073822;
      --bg-canvas: #f4f6f8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-canvas);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .login-card {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #eaeaea;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 400px;
      padding: 2.5rem;
    }

    .btn-dti {
      background-color: var(--dti-green);
      color: white;
      font-weight: 500;
    }

    .btn-dti:hover {
      background-color: var(--dti-green-hover);
      color: white;
    }

    .form-control:focus {
      border-color: var(--dti-green);
      box-shadow: 0 0 0 0.25rem rgba(10, 77, 46, 0.15);
    }

    .fs-7 { font-size: 0.85rem; }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- Header -->
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-success-subtle text-success rounded-circle mb-2" style="width: 56px; height: 56px;">
        <i class="bi bi-building-check fs-2"></i>
      </div>
      <h5 class="fw-bold mb-0 text-success">Weaver-ID Portal</h5>
      <p class="text-muted fs-7">Sign in to your account</p>
    </div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="email" class="form-label fs-7 fw-semibold">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
          <input type="email" id="email" class="form-control border-start-0 ps-0" placeholder="hub@montanosa.org" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label fs-7 fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
          <input type="password" id="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
        </div>
      </div>

      <div id="loginError" class="alert alert-danger py-2 fs-7 d-none"></div>

      <button type="submit" class="btn btn-dti w-100 py-2 mb-3" id="loginBtn">Sign In</button>
    </form>
  </div>

  <script>
  // ============================================
  // TEMPORARY MOCK AUTH — remove this whole block
  // once the real backend endpoint is ready, and
  // restore the fetch() version instead.
  // ============================================

  const MOCK_USERS = [
    {
      email: 'superadmin@weaverid.gov.ph',
      password: 'admin123',
      role: 'dti_admin',
      municipality: null
    },
    {
      email: 'hub@montanosa.org',
      password: 'hub123',
      role: 'association_staff',
      municipality: 'Sagada'
    },
    {
      email: 'bontoc@weaverid.gov.ph',
      password: 'hub123',
      role: 'association_staff',
      municipality: 'Bontoc'
    }
  ];

  function mockLogin(email, password) {
    // Simulates network delay so the loading state is visible during testing
    return new Promise((resolve, reject) => {
      setTimeout(() => {
        const user = MOCK_USERS.find(u => u.email === email && u.password === password);
        if (user) {
          resolve({
            token: 'mock-token-' + Date.now(),
            role: user.role,
            municipality: user.municipality
          });
        } else {
          reject(new Error('Invalid credentials'));
        }
      }, 600);
    });
  }

  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorBox = document.getElementById('loginError');
    const loginBtn = document.getElementById('loginBtn');

    errorBox.classList.add('d-none');
    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in...';

    try {
      // TODO: once the backend is ready, replace mockLogin(email, password)
      // with the real fetch() call to AUTH_API_URL (see commented block below)
      const data = await mockLogin(email, password);

      sessionStorage.setItem('weaverid_token', data.token);
      sessionStorage.setItem('weaverid_role', data.role);
      sessionStorage.setItem('weaverid_municipality', data.municipality || '');

      window.location.href = data.role === 'dti_admin' ? './admin.html' : './association_dashboard.html';

    } catch (err) {
      errorBox.textContent = 'Invalid email or password.';
      errorBox.classList.remove('d-none');
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign In';
    }
  });

  /* ============================================
     REAL VERSION — uncomment and delete the mock
     block above once the backend endpoint exists.

    } catch (err) {

    }
  });
  */
</script>
</body>
</html>
