<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weaver-ID | Unified Login</title>
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --dti-green: #0a4d2e;
      --dti-green-hover: #073822;
      --bg-canvas: #f4f6f8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-canvas);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .login-card {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #eaeaea;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
    }

    /* Updated Header Brand Styling */
    .brand-header-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 1rem;
    }

    .brand-logo-img {
      height: 48px;
      width: auto;
      object-fit: contain;
    }

    .brand-divider {
      width: 1px;
      height: 38px;
      background-color: #cbd5e1;
    }

    .brand-text-block {
      text-align: left;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #005a36;
      line-height: 1.1;
      margin: 0;
    }

    .brand-subtitle {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 2px;
    }

    .btn-dti {
      background-color: var(--dti-green);
      color: white;
      font-weight: 500;
    }

    .btn-dti:hover {
      background-color: var(--dti-green-hover);
      color: white;
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--dti-green);
      box-shadow: 0 0 0 0.25rem rgba(10, 77, 46, 0.15);
    }

    .fs-7 { font-size: 0.85rem; }
    .fs-8 { font-size: 0.75rem; }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- Updated Header with Official Logo -->
    <div class="text-center mb-4">
      <div class="brand-header-container">
        <!-- Replace src with the relative path to your official logo file -->
        <img src="logo.png" alt="WEAVER-ID Logo" class="brand-logo-img">
        <div class="brand-divider"></div>
        <div class="brand-text-block">
          <h5 class="brand-title">Weaver-ID</h5>
          <div class="brand-subtitle">Unified Portal</div>
        </div>
      </div>
      <p class="text-muted fs-7 mb-0">Sign in to continue</p>
    </div>

    <!-- HTML Form -->
    <form id="combinedLoginForm" novalidate>
      <!-- check this at the script part. kinukuha niya ang mga information and is directing it to the -->
      <!-- Email Input -->
      <div class="mb-3">
        <label for="email" class="form-label fs-7 fw-semibold">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
          <input type="email" id="email" class="form-control border-start-0 ps-0" placeholder="user@domain.org" required>
        </div>
      </div>

      <!-- Password Input -->
      <div class="mb-3">
        <label for="password" class="form-label fs-7 fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
          <input type="password" id="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
        </div>
      </div>

      <!-- Submit Button -->
      <div id="loginError" class="alert alert-danger py-2 fs-7 d-none" role="alert"></div>
      <button type="submit" id="loginBtn" class="btn btn-dti w-100 py-2 mb-3">Sign In</button>

    </form>

    <p class="text-center fs-7 text-muted mb-0">
      Is your association not registered yet?
      <a href="register.html">Apply for an account</a> or <a href="register.html#check">check your application</a>.
    </p>
  </div>

  <script src="js/api.js"></script>
  <script>
    (function () {
      var form = document.getElementById('combinedLoginForm');
      var btn = document.getElementById('loginBtn');
      var box = document.getElementById('loginError');

      function showError(text) { box.textContent = text; box.classList.remove('d-none'); }

      // Already signed in? Go straight to the right dashboard.
      var existing = Weaver.user();
      if (Weaver.token() && existing && Weaver.homeFor(existing.role)) {
        window.location.href = Weaver.homeFor(existing.role);
        return;
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        box.classList.add('d-none');
        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;
        if (!email || !password) { showError('Enter your email and password.'); return; }

        btn.disabled = true;
        btn.textContent = 'Signing in...';
        Weaver.login(email, password).then(function (user) {
          var home = Weaver.homeFor(user.role);
          if (!home) { showError('This account type has no dashboard.'); return; }
          window.location.href = home;
        }).catch(function (err) {
          showError(Weaver.errorText(err));
        }).then(function () {
          btn.disabled = false;
          btn.textContent = 'Sign In';
        });
      });
    })();
  </script>

</body>
</html>
