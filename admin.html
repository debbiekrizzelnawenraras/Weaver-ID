<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DTI Super Admin Dashboard - Weaver-ID</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Auth Verification Overlay -->
  <div id="authCheckOverlay" class="position-fixed top-0 start-0 w-100 h-100 bg-white d-flex align-items-center justify-content-center z-3">
    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Verifying session...</span></div>
  </div>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary px-3">
    <a class="navbar-brand fw-bold" href="#">WEAVER-ID Super Admin</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="#weavers">Weavers</a></li>
        <li class="nav-item"><a class="nav-link" href="#products">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="#tag-requests">NFC Approvals</a></li>
      </ul>
      <div class="d-flex align-items-center text-white">
        <span id="userDisplayName" class="me-3 fs-6"></span>
        <button onclick="handleLogout()" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Logout</button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <!-- Action Bar -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>System Management</h2>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#registerWeaverModal"><i class="bi bi-person-plus-fill"></i> Register New Weaver</button>
    </div>

    <!-- Weaver Table -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-white fw-bold">Registered Weaver Profiles</div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Full Name</th>
                <th>Municipality / Barangay</th>
                <th>Association</th>
                <th>DTI/OTOP Reg #</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="weaverTableBody">
              <!-- Dynamically populated via API -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Register Weaver Modal -->
  <div class="modal fade" id="registerWeaverModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="weaverRegisterForm" onsubmit="handleWeaverSubmit(event)">
          <div class="modal-header">
            <h5 class="modal-title">Register Weaver Profile</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" id="weaverFullName" class="form-control" required>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <label class="form-label">Barangay</label>
                <input type="text" id="weaverBarangay" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Municipality</label>
                <input type="text" id="weaverMunicipality" class="form-control" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Association Affiliation</label>
              <input type="text" id="weaverAssociation" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">DTI/OTOP Registration # (Optional)</label>
              <input type="text" id="weaverDtiOtopReg" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Contact Number</label>
              <input type="tel" id="weaverContact" class="form-control" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Weaver Profile</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_BASE = '/api';
    let idleTimer;

    // Session Validation & Auto Logout (15 min idle)
    function resetIdleTimer() {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        alert('Session expired due to 15 minutes of inactivity.');
        handleLogout();
      }, 15 * 60 * 1000);
    }

    window.onload = function() {
      const token = localStorage.getItem('jwt_token');
      if (!token) {
        window.location.href = '/login.html';
        return;
      }
      document.getElementById('authCheckOverlay').classList.add('d-none');
      document.addEventListener('mousemove', resetIdleTimer);
      document.addEventListener('keypress', resetIdleTimer);
      resetIdleTimer();
      fetchWeavers();
    };

    function handleLogout() {
      localStorage.removeItem('jwt_token');
      window.location.href = '/login.html';
    }

    async function fetchWeavers() {
      const token = localStorage.getItem('jwt_token');
      try {
        const res = await fetch(`${API_BASE}/weavers`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('Unauthorized');
        const data = await res.json();
        const tbody = document.getElementById('weaverTableBody');
        tbody.innerHTML = data.map(w => `
          <tr>
            <td class="fw-bold">${w.fullName}</td>
            <td>${w.municipality}, ${w.barangay}</td>
            <td>${w.associationAffiliation}</td>
            <td>${w.dtiOtopRegNum || 'N/A'}</td>
            <td>
              <button onclick="editWeaver('${w.id}')" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></button>
              <button onclick="deactivateWeaver('${w.id}')" class="btn btn-sm btn-outline-danger"><i class="bi bi-slash-circle"></i></button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    async function handleWeaverSubmit(e) {
      e.preventDefault();
      const token = localStorage.getItem('jwt_token');
      const payload = {
        fullName: document.getElementById('weaverFullName').value,
        barangay: document.getElementById('weaverBarangay').value,
        municipality: document.getElementById('weaverMunicipality').value,
        associationAffiliation: document.getElementById('weaverAssociation').value,
        dtiOtopRegNum: document.getElementById('weaverDtiOtopReg').value,
        contactNumber: document.getElementById('weaverContact').value
      };

      const res = await fetch(`${API_BASE}/weavers`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        bootstrap.Modal.getInstance(document.getElementById('registerWeaverModal')).hide();
        fetchWeavers();
      }
    }
  </script>
</body>
</html>
