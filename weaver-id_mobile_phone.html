<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weaver-ID Verification</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .card-container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            padding: 32px;
            max-width: 420px;
            width: 100%;
            border: 1px solid #edf2f7;
        }
        .status-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            font-size: 2rem;
        }
        .status-icon.success { background-color: #dcfce7; color: #15803d; }
        .status-icon.error { background-color: #fee2e2; color: #dc2626; }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #e2e8f0;
            font-size: 0.9rem;
        }
        .detail-row:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <div class="card-container text-center">
        <!-- LOADING STATE -->
        <div id="state-loading">
            <div class="spinner-border text-success mb-3" style="width: 2.5rem; height: 2.5rem;" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <h5 class="fw-bold mb-1">Authenticating NFC Tag</h5>
            <p class="text-muted small">Checking registration database...</p>
        </div>

        <!-- SUCCESS STATE -->
        <div id="state-success" class="d-none">
            <div class="status-icon success">
                <i class="bi bi-shield-check"></i>
            </div>
            <h5 class="fw-bold mb-1">Authentication Successful</h5>
            <p class="text-muted small mb-4">Official Weaver NFC Tag Verified</p>

            <div class="bg-light p-3 rounded-3 text-start mb-4">
                <div class="detail-row">
                    <span class="text-muted">Weaver ID:</span>
                    <span class="fw-bold" id="weaver-id">-</span>
                </div>
                <div class="detail-row">
                    <span class="text-muted">Weaver Name:</span>
                    <span class="fw-bold" id="weaver-name">-</span>
                </div>
                <div class="detail-row">
                    <span class="text-muted">Business / Guild:</span>
                    <span class="fw-bold" id="weaver-business">-</span>
                </div>
                <div class="detail-row">
                    <span class="text-muted">Status:</span>
                    <span class="badge bg-success">Active</span>
                </div>
            </div>
        </div>

        <!-- ERROR STATE -->
        <div id="state-error" class="d-none">
            <div class="status-icon error">
                <i class="bi bi-exclamation-triangle"></i>
            </div>
            <h5 class="fw-bold mb-1">Verification Failed</h5>
            <p class="text-danger small fw-semibold mb-4" id="error-message">An error occurred.</p>
        </div>

        <!-- MANUAL SEARCH INPUT (Fallback if no NFC UID parameter is supplied) -->
        <div id="state-input" class="d-none">
            <div class="mb-3">
                <i class="bi bi-wifi text-success fs-1"></i>
                <h5 class="fw-bold mt-2">NFC Verification Portal</h5>
                <p class="text-muted small">Tap an NFC tag to verify.</p>
            </div>
            <!-- <form id="verify-form" class="mb-3">
                <input type="text" id="manual-nfc-input" class="form-control text-center mb-3" placeholder="Enter NFC UID (e.g., 04:A2:8B:12)" required>
                <button type="submit" class="btn btn-success w-100">Verify Card</button>
            </form> -->
        </div>

        <!-- RE-SCAN BUTTON -->
        <button id="rescan-btn" class="btn btn-outline-secondary w-100 btn-sm d-none" onclick="resetView()">
            <i class="bi bi-arrow-left"></i> Scan Another Card
        </button>
    </div>

    <script>
        // UPDATE THIS URL to point to where your PHP backend script is hosted on live server
        const BACKEND_API_URL = 'https://your-domain.com/api/verify_nfc.php';

        document.addEventListener('DOMContentLoaded', function () {
            const urlParams = new URLSearchParams(window.location.search);
            const nfcUid = urlParams.get('nfc_uid');

            if (nfcUid) {
                verifyNFC(nfcUid);
            } else {
                showState('input');
            }

            document.getElementById('verify-form').addEventListener('submit', function (e) {
                e.preventDefault();
                const uid = document.getElementById('manual-nfc-input').value.trim();
                if (uid) verifyNFC(uid);
            });
        });

        function verifyNFC(uid) {
            showState('loading');

            fetch(`${BACKEND_API_URL}?nfc_uid=${encodeURIComponent(uid)}`)
                .then(response => response.json().then(data => ({ status: response.status, body: data })))
                .then(res => {
                    if (res.body.status === 'success') {
                        document.getElementById('weaver-id').textContent = '#' + res.body.data.id;
                        document.getElementById('weaver-name').textContent = res.body.data.name;
                        document.getElementById('weaver-business').textContent = res.body.data.business;
                        showState('success');
                    } else {
                        showError(res.body.message || 'Verification failed.');
                    }
                })
                .catch(() => {
                    showError('Unable to connect to verification server.');
                });
        }

        function showError(msg) {
            document.getElementById('error-message').textContent = msg;
            showState('error');
        }

        function showState(state) {
            document.getElementById('state-loading').classList.add('d-none');
            document.getElementById('state-success').classList.add('d-none');
            document.getElementById('state-error').classList.add('d-none');
            document.getElementById('state-input').classList.add('d-none');
            document.getElementById('rescan-btn').classList.add('d-none');

            document.getElementById(`state-${state}`).classList.remove('d-none');

            if (state === 'success' || state === 'error') {
                document.getElementById('rescan-btn').classList.remove('d-none');
            }
        }

        function resetView() {
            window.history.pushState({}, document.title, window.location.pathname);
            document.getElementById('manual-nfc-input').value = '';
            showState('input');
        }
    </script>
</body>
</html>
