<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEAVER-ID | Association Dashboard</title>
  <style>
    /* EXACT SAME CSS VARIABLES & STYLES AS ADMIN.HTML */
    :root {
      --primary-color: #0d5c3a;
      --accent-color: #c48b18;
      --admin-badge: #1e293b;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
    }

    /* HEADER STYLES */
    .header-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 15px 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      margin-bottom: 25px;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .logo-group img {
      height: 60px;
      object-fit: contain;
    }

    .header-title {
      text-align: right;
    }

    .header-title h1 {
      font-size: 1.5rem;
      color: var(--primary-color);
    }

    .header-title p {
      font-size: 0.85rem;
      color: var(--accent-color);
      font-weight: 600;
      margin-top: 3px;
    }

    /* METRICS GRID */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      border-left: 5px solid var(--primary-color);
    }

    .stat-card.accent {
      border-left-color: var(--accent-color);
    }

    .stat-card.dark {
      border-left-color: var(--admin-badge);
    }

    .stat-card h3 {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-card .number {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--text-main);
      margin-top: 8px;
    }

    /* CONTROLS BAR */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 15px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
    }

    .filter-group select {
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
      background: #fff;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #08432a;
    }

    .btn-accent {
      background-color: var(--accent-color);
      color: #ffffff;
    }

    .btn-accent:hover {
      background-color: #a37312;
    }

    /* TABLES */
    .section-title {
      margin-top: 25px;
      margin-bottom: 12px;
      color: var(--primary-color);
      font-size: 1.15rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      margin-bottom: 25px;
    }

    th, td {
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: var(--primary-color);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    tr:hover {
      background-color: #f1f5f9;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .badge-success {
      background-color: #dcfce7;
      color: #15803d;
    }

    .badge-warning {
      background-color: #fef3c7;
      color: #b45309;
    }

    /* MODAL STYLES */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .modal-card h3 {
      margin-bottom: 15px;
      color: var(--primary-color);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 5px;
      font-size: 0.9rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-secondary {
      background: #cbd5e1;
      color: #334155;
    }
  </style>
</head>
<body>

  <!-- HEADER (MATCHING ADMIN HEADER LAYOUT) -->
  <div class="header-container">
    <div class="logo-group">
      <img src="weaver-id-logo.png" alt="WEAVER-ID Logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Department_of_Trade_and_Industry_%28DTI%29.svg/1200px-Department_of_Trade_and_Industry_%28DTI%29.svg.png" alt="DTI Logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/f/f8/Bagong_Pilipinas_logo.png" alt="Bagong Pilipinas Logo">
    </div>
    <div class="header-title">
      <h1 id="associationTitle">SAGADA WEAVERS ASSOCIATION</h1>
      <p>WEAVER-ID | Association Member Portal</p>
    </div>
  </div>

  <!-- STATS METRICS (EXACT 4-CARD METRIC GRID) -->
  <div class="stats-grid">
    <div class="stat-card">
      <h3>Affiliated Weavers</h3>
      <div class="number" id="statWeaverCount">0</div>
    </div>
    <div class="stat-card accent">
      <h3>Active NFC Cards</h3>
      <div class="number" id="statNfcCount">0</div>
    </div>
    <div class="stat-card dark">
      <h3>Pending NFC Issues</h3>
      <div class="number" id="statPendingNfc">0</div>
    </div>
    <div class="stat-card">
      <h3>Municipality Hub</h3>
      <div class="number" style="font-size: 1.2rem; font-weight: 600; margin-top: 12px;">Sagada</div>
    </div>
  </div>

  <!-- ACTIONS & FILTERS (IDENTICAL CONTROL BAR) -->
  <div class="action-bar">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search weaver name, mobile, or barangay..." onkeyup="filterTable()">
    </div>
    <div class="filter-group">
      <select id="statusFilter" onchange="filterTable()">
        <option value="ALL">All Statuses</option>
        <option value="Issued">NFC Issued</option>
        <option value="Pending">NFC Pending</option>
      </select>
    </div>
    <div class="btn-group">
      <button class="btn btn-accent" onclick="openModal('weaverModal')">+ Add Member Weaver</button>
    </div>
  </div>

  <!-- INDIVIDUAL WEAVERS TABLE -->
  <div class="section-title">Association Member Weavers Directory</div>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Full Weaver Name</th>
        <th>Mobile Number</th>
        <th>Barangay</th>
        <th>Municipality</th>
        <th>NFC Tag Status</th>
      </tr>
    </thead>
    <tbody id="weaverTableBody"></tbody>
  </table>

  <!-- MODAL: REGISTER MEMBER WEAVER -->
  <div class="modal-overlay" id="weaverModal">
    <div class="modal-card">
      <h3>Register Member Weaver</h3>
      <form id="weaverForm" onsubmit="addWeaver(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="wName" placeholder="e.g., Virginia Omaweng" required>
        </div>
        <div class="form-group">
          <label>Mobile Number</label>
          <input type="text" id="wMobile" placeholder="e.g., 09123456789" required>
        </div>
        <div class="form-group">
          <label>Barangay</label>
          <input type="text" id="wBarangay" placeholder="e.g., Demang" required>
        </div>
        <div class="form-group">
          <label>Municipality</label>
          <input type="text" id="wMunicipality" value="Sagada" readonly style="background: #f1f5f9;">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal('weaverModal')">Cancel</button>
          <button type="submit" class="btn btn-accent">Save Member</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // MEMBER WEAVERS SPECIFIC TO THIS ASSOCIATION
    let weaverList = [
      { name: "Virginia Omaweng", mobile: "09978178644", barangay: "Demang", municipality: "Sagada", nfcStatus: "Issued" },
      { name: "Rose Ann Wangdali", mobile: "09502033126", barangay: "Demang", municipality: "Sagada", nfcStatus: "Issued" },
      { name: "Florence Aliwengweng", mobile: "09171234567", barangay: "Demang", municipality: "Sagada", nfcStatus: "Pending" },
      { name: "Agnes Cadiogan", mobile: "09121527484", barangay: "Demang", municipality: "Sagada", nfcStatus: "Issued" },
      { name: "Rufina Aluyen", mobile: "09308144979", barangay: "Demang", municipality: "Sagada", nfcStatus: "Issued" },
      { name: "Mercy Dalis", mobile: "09182345671", barangay: "Dagdag", municipality: "Sagada", nfcStatus: "Issued" },
      { name: "Evelyn Kiat-ong", mobile: "09293456782", barangay: "Dagdag", municipality: "Sagada", nfcStatus: "Issued" },
      { name: "Grace Peg-ang", mobile: "09384567893", barangay: "Poblacion", municipality: "Sagada", nfcStatus: "Pending" }
    ];

    // RENDER TABLE AND STATS
    function render() {
      const weaverBody = document.getElementById("weaverTableBody");
      weaverBody.innerHTML = "";

      weaverList.forEach((item, index) => {
        const badgeClass = item.nfcStatus === "Issued" ? "badge-success" : "badge-warning";
        weaverBody.innerHTML += `
          <tr>
            <td>${index + 1}</td>
            <td><strong>${item.name}</strong></td>
            <td>${item.mobile}</td>
            <td>${item.barangay}</td>
            <td>${item.municipality}</td>
            <td><span class="badge ${badgeClass}">${item.nfcStatus}</span></td>
          </tr>
        `;
      });

      document.getElementById("statWeaverCount").innerText = weaverList.length;
      document.getElementById("statNfcCount").innerText = weaverList.filter(w => w.nfcStatus === "Issued").length;
      document.getElementById("statPendingNfc").innerText = weaverList.filter(w => w.nfcStatus === "Pending").length;
    }

    // MODAL CONTROL
    function openModal(id) { document.getElementById(id).style.display = "flex"; }
    function closeModal(id) { document.getElementById(id).style.display = "none"; }

    function addWeaver(e) {
      e.preventDefault();
      weaverList.push({
        name: document.getElementById("wName").value,
        mobile: document.getElementById("wMobile").value,
        barangay: document.getElementById("wBarangay").value,
        municipality: document.getElementById("wMunicipality").value,
        nfcStatus: "Pending"
      });
      render();
      closeModal("weaverModal");
      document.getElementById("weaverForm").reset();
    }

    // FILTER FUNCTION
    function filterTable() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const status = document.getElementById("statusFilter").value;

      document.querySelectorAll("#weaverTableBody tr").forEach(tr => {
        const textMatch = tr.innerText.toLowerCase().includes(q);
        const statusMatch = status === "ALL" || tr.children[5].innerText.trim() === status;
        tr.style.display = textMatch && statusMatch ? "" : "none";
      });
    }

    render();
  </script>
</body>
</html>
